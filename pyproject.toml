[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dualcomp-rs"
version = "0.1.0"
description = "Paper-derived reference components for semantic-geometric visual-token compression"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  {name = "Yueying Li"},
  {name = "Fengxiang Wang"},
  {name = "Yan Li"},
  {name = "Mingshuo Chen"},
  {name = "Mengying Zhao"},
  {name = "Long Lan"},
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.1,<3",
]

[project.urls]
Repository = "https://github.com/Cynthia314/DualComp"
Issues = "https://github.com/Cynthia314/DualComp/issues"

[project.optional-dependencies]
test = [
  "pytest>=7.4,<9",
  "pytest-cov>=4.1,<7",
]
dev = [
  "build>=1,<2",
  "pytest>=7.4,<9",
  "ruff>=0.6,<1",
  "twine>=5,<7",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["dualcomp", "dualcomp.*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.coverage.run]
source = ["dualcomp"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
